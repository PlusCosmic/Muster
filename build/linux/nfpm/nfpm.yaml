# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "muster"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Shared mod setups for RimWorld and Minecraft"
vendor: "PlusCosmic"
homepage: "https://github.com/PlusCosmic/Muster"
license: "All rights reserved"
release: "1"

contents:
  - src: "./bin/muster"
    dst: "/usr/local/bin/muster"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/muster.png"
  - src: "./build/linux/muster.desktop"
    dst: "/usr/share/applications/muster.desktop"

# Muster is RimForge renamed and widened to more games; installing it takes
# over from the old package, and the app adopts the old data directory on
# first start (internal/appdir.MigrateLegacy).
replaces:
  - rimforge
conflicts:
  - rimforge

# Linux builds pass the gtk3 tag (see Taskfile.yml), so the binary links
# GTK3 + WebKit2GTK 4.1 and the packages must depend on that stack, not the
# GTK4 + WebKitGTK 6.0 one Wails defaults to.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

  # Arch Linux packages
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If the build ever drops the gtk3 tag (Wails removes it in v3.1), switch the
# depends/overrides above to the GTK4 + WebKitGTK 6.0 stack:
#
# depends:
#   - libgtk-4-1
#   - libwebkitgtk-6.0-4
# overrides:
#   rpm:
#     depends:
#       - gtk4
#       - webkitgtk6.0
#   archlinux:
#     depends:
#       - gtk4
#       - webkitgtk-6.0
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
