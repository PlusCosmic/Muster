name: release

# Runs the definition-of-done suite on every merge to main and, only if it
# passes, (a) asks PlusCosmic/packages to build and publish an Arch package and
# (b) publishes a Windows build as a GitHub release, once per version. This
# repository never writes to the package bucket: a single repository owns every
# index update so that concurrent publishes cannot drop entries from the shared
# database. See docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# pkgrel is the packaging repository's run number, so it orders packages by when
# they were dispatched rather than by when they were committed. Two merges
# landing within the verify window could otherwise finish out of order and hand
# the older commit the higher pkgrel, offering it to clients as an upgrade over
# the newer one. Superseding a run cancels it, so only the newest commit on the
# branch ever reaches the dispatch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Wails 3 links webkit2gtk-4.1 with the gtk3 build tag; every Go step
      # below passes it, matching what the Arch package builds.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - run: npm ci
        working-directory: frontend

      # The checks from README.md, in the same order. A change that compiles but
      # fails these must not reach a client as an upgrade.
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      # frontend/bindings is generated from app.go and internal/models and is
      # committed so the frontend checks above need no Go toolchain. A stale
      # copy means the frontend was checked against the wrong API.
      - name: Check the committed bindings are current
        run: |
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          wails3 generate bindings -ts -i -clean=true -d frontend/bindings -f "-tags gtk3"
          git diff --exit-code -- frontend/bindings

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -tags gtk3 ./...
      # The _windows.go and _darwin.go files never compile on this runner, so
      # type-check them for their own platforms. Only the pure-Go internal
      # packages: the Wails root package needs each platform's toolchain.
      - run: GOOS=windows go vet ./internal/...
      - run: GOOS=darwin go vet ./internal/...
      - run: go test -tags gtk3 ./...
      - run: go build -tags gtk3,production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/muster .

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse anything but the current tip of main
        run: |
          # pkgrel is the packaging repository's run number, so any dispatch
          # outranks every package already published — including one built from
          # code that is not on main. There are two ways in: workflow_dispatch
          # takes whichever ref it is launched from, and re-running an old run
          # replays that run's original SHA. Either would reach clients as an
          # upgrade, nothing prunes a bad package from the bucket, and undoing
          # one means bumping the version to supersede it. Cheaper to refuse.
          #
          # This fails rather than skipping: a manual run from a branch is
          # someone trying to publish, and a silent success would look like it
          # worked. The verify job above still runs, so it is usable as a check.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "release publishes from main only; this run is on $GITHUB_REF" >&2
            exit 1
          fi

          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main has moved to $tip; this run is for $GITHUB_SHA." >&2
            echo "That commit's own run publishes it — do not replay this one." >&2
            exit 1
          fi

      - name: Dispatch to the packaging repository
        env:
          # Fine-grained PAT with contents:write on PlusCosmic/packages;
          # GITHUB_TOKEN cannot dispatch across repositories.
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          # build/config.yml is the version of record; frontend/package.json
          # tracks it but is not what the packaging repository reads.
          version=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' build/config.yml)
          test -n "$version" || { echo "no version in build/config.yml" >&2; exit 1; }

          gh api repos/PlusCosmic/packages/dispatches \
            -f event_type=publish \
            -f "client_payload[package]=muster" \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[ref]=$GITHUB_SHA" \
            -f "client_payload[version]=$version"

          echo "Dispatched muster $version at $GITHUB_SHA" \
            >> "$GITHUB_STEP_SUMMARY"

  # Windows has no package manager for us, so the app updates itself from the
  # signed manifest attached to the latest GitHub release (docs/ARCHITECTURE.md
  # "Self-update"). One release per version: a merge that does not bump
  # build/config.yml republishes nothing here.
  windows:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this version needs a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' build/config.yml)
          test -n "$version" || { echo "no version in build/config.yml" >&2; exit 1; }
          # The updater compares internal/version.Version against the manifest;
          # publishing under any other number would never update or update forever.
          built=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' internal/version/version.go)
          if [ "$built" != "$version" ]; then
            echo "internal/version.Version is $built but build/config.yml says $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        if: steps.version.outputs.publish == 'true'
        with:
          go-version-file: go.mod

      - name: Install toolchain
        if: steps.version.outputs.publish == 'true'
        run: |
          # nsis builds the installer; the wails3 CLI (update manifest) links
          # webkit2gtk-4.1 like the app does on Linux.
          sudo apt-get update
          sudo apt-get install -y nsis zip libwebkit2gtk-4.1-dev libgtk-3-dev
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Build muster.exe
        if: steps.version.outputs.publish == 'true'
        run: |
          (cd frontend && npm ci && npm run build)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -H windowsgui" -o bin/muster.exe .

      - name: Build the installer
        if: steps.version.outputs.publish == 'true'
        working-directory: build/windows/nsis
        run: |
          # Per-user: installs to %LOCALAPPDATA%\Programs\Muster with no UAC
          # prompt, where the updater can swap the exe without elevation.
          makensis -DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user \
            -DARG_WAILS_AMD64_BINARY="$PWD/../../../bin/muster.exe" project.nsi
          mv ../../../bin/muster-amd64-installer.exe ../../../bin/Muster-installer.exe

      - name: Sign the update manifest
        if: steps.version.outputs.publish == 'true'
        working-directory: bin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPDATER_KEY: ${{ secrets.MUSTER_UPDATER_KEY }}
        run: |
          test -n "$UPDATER_KEY" || { echo "MUSTER_UPDATER_KEY secret is missing" >&2; exit 1; }
          umask 077; printf '%s\n' "$UPDATER_KEY" > updater.key
          zip -q "muster-$VERSION-windows-amd64.zip" muster.exe
          # Artifact URLs point at this release's own permanent download path,
          # so an older manifest a client already fetched stays valid.
          wails3 updater manifest -version "$VERSION" -channel stable \
            -name "Muster $VERSION" -key updater.key \
            -url-prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION/" \
            -output stable.json "muster-$VERSION-windows-amd64.zip"
          rm -f updater.key
          wails3 updater verify -manifest stable.json -publickey ../build/updater.pub -dir .

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --title "Muster $VERSION" --target "$GITHUB_SHA" \
            --notes "Windows: run Muster-installer.exe once; the app updates itself from then on. Linux (Arch): pacman." \
            "bin/muster-$VERSION-windows-amd64.zip" bin/Muster-installer.exe bin/stable.json
          echo "Released v$VERSION with the Windows installer and update manifest." >> "$GITHUB_STEP_SUMMARY"
